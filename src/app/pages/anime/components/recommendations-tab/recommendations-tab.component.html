@if (similar.isLoading()) {
  <tui-loader size="l" />
} @else if (similar.error()) {
  <app-load-error
    title="Не удалось загрузить похожие"
    [message]="similar.error()?.message"
    (retry)="similar.reload()"
  />
} @else if (similar.value(); as list) {
  @if (list.length === 0) {
    <p class="state">Похожих тайтлов не нашлось.</p>
  } @else {
    <div class="grid">
      @for (anime of list; track anime.animeId) {
        <app-anime-card
          [animeId]="anime.animeId"
          [title]="anime.title"
          [poster]="anime.poster"
          [year]="anime.year"
          [type]="anime.type.shortname || anime.type.name"
          [statusTitle]="anime.animeStatus.title"
          [statusAlias]="anime.animeStatus.alias"
          [rating]="anime.rating.average"
          [episodesAired]="anime.episodes?.aired"
          [episodesCount]="anime.episodes?.count"
        />
      }
    </div>
  }
}
