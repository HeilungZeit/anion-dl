@if (anime.isLoading()) {
  <tui-loader size="l" />
} @else if (anime.error()) {
  <p class="error">Не удалось загрузить аниме: {{ anime.error()?.message }}</p>
} @else if (anime.value(); as data) {
  <div class="page">
    <app-anime-header [anime]="data" />

    <tui-tabs
      class="tabs"
      [activeItemIndex]="tabIndex()"
      (activeItemIndexChange)="tabIndex.set($event)"
    >
      <button tuiTab type="button">Просмотр</button>
      <button tuiTab type="button">Загрузки</button>
      <button tuiTab type="button">Похожие аниме</button>
    </tui-tabs>

    <!--
      Вкладка просмотра не размонтируется, а прячется: @switch уничтожил бы
      плеер вместе с позицией и буфером, и уход в загрузки за одним кликом
      сбрасывал бы серию на начало.
    -->
    <div class="panel" [class.panel--hidden]="tabIndex() !== 0">
      <app-description-tab
        [anime]="data"
        [dubbing]="selectedDubbing()"
        [dubbings]="dubbings()"
        [episodes]="episodes()"
        [requestedEpisode]="requestedEpisode()"
        [videos]="kodikVideos()"
        [videos]="kodikVideos()"
        (dubbingChange)="selectedDubbing.set($event)"
      />
    </div>

    @if (tabIndex() === 1) {
      <app-downloads-tab
        [animeId]="data.animeId"
        [dubbing]="selectedDubbing()"
        [dubbings]="dubbings()"
        [episodes]="episodes()"
        [title]="data.title"
        [videos]="kodikVideos()"
        (dubbingChange)="selectedDubbing.set($event)"
      />
    }

    @if (tabIndex() === 2) {
      <app-recommendations-tab [animeId]="data.animeId" />
    }
  </div>
}
