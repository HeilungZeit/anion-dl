[package]
name = "anion-dl"
version = "0.1.6"
description = "Оффлайн-качалка серий для anion"
authors = ["Dmitry Gavrichenko"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "anion_dl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Только таймеры: резолвер опрашивает заголовок окна с паузой, а std::thread::sleep
# в async-команде заблокировал бы рантайм Tauri.
tokio = { version = "1", features = ["time"] }
# Проверка существования манифеста нужного качества. Идёт из Rust, а не из UI,
# чтобы не вносить домены CDN в capabilities: они меняются и заранее неизвестны.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
