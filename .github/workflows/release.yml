name: Release desktop app

on:
  push:
    tags:
      - 'app-v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Match tag to tauri.conf.json
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          expected="app-v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match ${expected}" >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

  release:
    name: ${{ matrix.label }}
    needs: verify-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            asset_pattern: anion-dl-macos-arm64[ext]
          - label: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            asset_pattern: anion-dl-macos-x64[ext]
          - label: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            asset_pattern: anion-dl-linux-x64[ext]
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            asset_pattern: anion-dl-windows-x64[setup][ext]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            nasm \
            patchelf \
            pkg-config \
            xdg-utils

      - name: Install MSYS2 for FFmpeg
        if: matrix.platform == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            curl
            mingw-w64-x86_64-toolchain
            nasm
            xz

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "GitHub secret TAURI_SIGNING_PRIVATE_KEY is not configured" >&2
            exit 1
          fi

      - name: Build FFmpeg sidecar
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: ./scripts/fetch-ffmpeg.sh "${{ matrix.target }}"

      - name: Build FFmpeg sidecar on Windows
        if: matrix.platform == 'windows-latest'
        shell: msys2 {0}
        run: ./scripts/fetch-ffmpeg.sh "${{ matrix.target }}"

      - name: Build bundles and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'anion-dl ${{ needs.verify-version.outputs.version }}'
          releaseBody: 'Выберите установщик для своей операционной системы в разделе Assets.'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: ${{ matrix.asset_pattern }}
          args: '--target ${{ matrix.target }} --bundles ${{ matrix.bundles }}'
